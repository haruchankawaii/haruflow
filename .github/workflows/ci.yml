name: Community checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:test-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: haruflow-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t haruflow/community:local .
      - run: docker run --rm haruflow/community:local --help
      - run: node scripts/configure.mjs
      - run: docker compose --env-file .env -f deploy/community/compose.yml up -d --wait postgres
      - run: docker compose --env-file .env -f deploy/community/compose.yml run --rm migrate
      - run: docker compose --env-file .env -f deploy/community/compose.yml up -d --wait --wait-timeout 90 app
      - run: node scripts/smoke.mjs seed
      - run: node scripts/database.mjs backup backups/ci.backup
      - run: node scripts/smoke.mjs mutate
      - run: node scripts/database.mjs restore backups/ci.backup --confirm-restore
      - run: docker compose --env-file .env -f deploy/community/compose.yml up -d --wait --wait-timeout 90 app
      - run: node scripts/smoke.mjs verify
      - run: node scripts/smoke.mjs recover
      - if: failure()
        run: docker compose --env-file .env -f deploy/community/compose.yml logs --tail=100
      - if: always()
        run: docker compose --env-file .env -f deploy/community/compose.yml down -v
