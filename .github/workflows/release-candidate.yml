name: Community release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HARUFLOW_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-candidate-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: bun install --cwd apps/web --frozen-lockfile
      - run: bun run build:web
      - run: cargo build --release --locked
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: haruflow-community-${{ runner.os }}-${{ github.sha }}
          path: output/releases/
          if-no-files-found: error
          retention-days: 30
