    <text x="1146" y="65" fill="#193d31" font-size="12" text-anchor="middle" font-weight="700" letter-spacing="1.9">COMMUNITY</text>
    <text x="58" y="158" fill="#d4ecba" font-size="12" font-weight="650" letter-spacing="3">ERP UNTUK USAHA KECIL</text>
    <text x="54" y="217" fill="#f7f8f4" font-size="53" font-weight="700" letter-spacing="-1.7">Kenali usaha.</text>
    <text x="54" y="278" fill="#f7f8f4" font-size="53" font-weight="700" letter-spacing="-1.7">Rapikan alurnya.</text>
    <text x="58" y="322" fill="#c6d4c6" font-size="17">Penjualan, pembelian, stok dan pembukuan</text>
    <text x="58" y="348" fill="#c6d4c6" font-size="17">dalam satu ruang kerja yang Anda kelola sendiri.</text>
