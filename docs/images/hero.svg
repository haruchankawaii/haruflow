  <circle cx="1190" cy="-45" r="300" fill="#295d46" fill-opacity=".48"/>
  <circle cx="1170" cy="-40" r="223" fill="none" stroke="#d4ecba" stroke-opacity=".09"/>
  <g font-family="Segoe UI,Arial,sans-serif">
