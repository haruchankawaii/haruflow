<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Haruflow Community — ruang kerja untuk usaha kecil</title>
  <desc id="desc">Identitas Haruflow berwarna hijau zaitun, krem dan lime. Satu perusahaan, IDR dan sepuluh akun aktif. Alur penjualan, stok, kas dan laporan saling terhubung.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#d4ecba" stroke-opacity=".055"/></pattern>
  </defs>
