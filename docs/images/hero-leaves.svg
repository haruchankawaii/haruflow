<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Haruflow Community — alur usaha rapi, keputusan lebih pasti</title>
  <desc id="hero-desc">Nama haruflow besar di tengah bidang hijau hutan, dengan simbol dua daun bertumpuk berwarna lime. ERP untuk usaha kecil, dalam satu alur yang saling terhubung.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#224d3d"/>
      <stop offset=".5" stop-color="#193d31"/>
      <stop offset="1" stop-color="#153329"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(642 156) rotate(90) scale(361 532)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f9d70" stop-opacity=".14"/>
      <stop offset="1" stop-color="#6f9d70" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="banner-shape"><rect width="1280" height="520" rx="28"/></clipPath>
    <mask id="leaf-separation" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36">
      <rect width="36" height="36" fill="#fff"/>
      <path d="M5 32V27.5C5 17.2 11.9 11 26 11C26 23.7 19.2 32 7.7 32H5Z" fill="#000" stroke="#000" stroke-width="2.6"/>
    </mask>
  </defs>

  <g clip-path="url(#banner-shape)">
    <rect width="1280" height="520" fill="url(#forest)"/>
    <rect width="1280" height="520" fill="url(#light)"/>

    <!-- Fine contour lines suggest a continuous, growing flow. -->
    <g fill="none" stroke="#d4ecba" stroke-width="1">
      <path d="M-120 454C47 454 18 264 176 264S304 46 210-54" stroke-opacity=".10"/>
      <path d="M-128 480C64 480 47 290 195 290S337 59 245-54" stroke-opacity=".075"/>
      <path d="M-132 506C79 506 76 316 214 316S370 72 280-54" stroke-opacity=".05"/>
      <path d="M1002 573C914 437 1009 319 1137 319S1244 104 1366 104" stroke-opacity=".10"/>
      <path d="M1035 573C947 447 1036 346 1158 346S1267 132 1366 132" stroke-opacity=".075"/>
      <path d="M1068 573C980 457 1063 373 1179 373S1290 160 1366 160" stroke-opacity=".05"/>
    </g>
    <circle cx="176" cy="264" r="3" fill="#d4ecba" fill-opacity=".30"/>
    <circle cx="1137" cy="319" r="3" fill="#d4ecba" fill-opacity=".25"/>

    <!-- The cutout is transparent; it stays crisp on every background. -->
    <g transform="translate(602.2 74) scale(2.1)" fill="#d4ecba">
      <path d="M10 22V18C10 8.8 17.4 3 31 3C31 14.7 24 22 13.3 22H10Z" opacity=".65" mask="url(#leaf-separation)"/>
      <path d="M5 32V27.5C5 17.2 11.9 11 26 11C26 23.7 19.2 32 7.7 32H5Z"/>
    </g>

    <g font-family="Segoe UI,Inter,Arial,sans-serif" text-anchor="middle">
      <text x="640" y="314" fill="#f7f8f4" font-size="180" font-weight="750" letter-spacing="-8">haruflow<tspan fill="#d4ecba">.</tspan></text>
      <text x="640" y="369" fill="#d1ddcf" font-size="22" font-weight="400" letter-spacing=".1">Alur usaha rapi. Keputusan lebih pasti.</text>
      <g fill="#d4ecba">
        <path d="M489 434H545M735 434H791" stroke="#d4ecba" stroke-opacity=".32"/>
        <text x="640" y="439" font-size="12" font-weight="600" letter-spacing="3.8">COMMUNITY</text>
      </g>
      <text x="640" y="471" fill="#a9bfa9" font-size="11" letter-spacing="1.6">ERP UNTUK USAHA KECIL</text>
    </g>
    <rect x=".5" y=".5" width="1279" height="519" rx="27.5" fill="none" stroke="#d4ecba" stroke-opacity=".12"/>
  </g>
</svg>
